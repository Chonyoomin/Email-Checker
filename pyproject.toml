[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-checker"
version = "0.1.0"
description = "Local email scam checker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "uvicorn==0.54.0",
  "laya==0.4.15",
  "python-multipart==0.0.32",
  "keyring==25.7.0",
  "google-auth==2.62.0",
  "google-auth-oauthlib==1.5.0",
  "google-api-python-client==2.201.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2", "build==1.6.1"]

[project.scripts]
email-checker = "bad_email_check.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bad_email_check = ["static/*", "laya_checkpoint.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = ["real_model: offline tests that load the installed real checkpoint"]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["src/**/*.py", "tests/product/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
