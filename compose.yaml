services:
  app:
    build: .
    image: email-checker:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EMAIL_CHECK_HOST: 0.0.0.0
      EMAIL_CHECK_ALLOW_NON_LOOPBACK: "true"
      EMAIL_CHECK_PORT: "8000"
      EMAIL_CHECK_GMAIL_CLIENT_FILE: ""
    volumes:
      - type: bind
        source: ./checkpoints/laya-english
        target: /models/laya
        read_only: true
      - scan-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    cpus: 4
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/readiness',timeout=5))['model_loaded']"]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5
volumes:
  scan-data:
