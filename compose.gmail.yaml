services:
  app:
    build: .
    image: email-checker:local
    network_mode: host
    environment:
      EMAIL_CHECK_HOST: 127.0.0.1
      EMAIL_CHECK_ALLOW_NON_LOOPBACK: "false"
      EMAIL_CHECK_PORT: "8000"
      EMAIL_CHECK_GMAIL_CLIENT_FILE: /run/secrets/gmail_client
    secrets: [gmail_client, keyring_unlock]
    volumes:
      - type: bind
        source: ./checkpoints/laya-english
        target: /models/laya
        read_only: true
      - scan-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    cpus: 4
secrets:
  gmail_client:
    file: ${GMAIL_CLIENT_SECRET_FILE:?Set a private Desktop client JSON path}
  keyring_unlock:
    file: ${KEYRING_UNLOCK_SECRET_FILE:?Set a private keyring passphrase file path}
volumes:
  scan-data:
